name: Build(arduino-m5stack)

env:
  SKETCH_NAMES_FIND_START: ./examples/UnitUnified
  REQUIRED_LIBRARIES: M5Unified,M5UnitUnified,M5Unit-HUB

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-m5-build-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/arduino-m5-build-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.build-properties }}:${{ matrix.sketch }}:${{matrix.board}}@${{matrix.platform-version}}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        platform-url:
          - https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json

        sketch:
          - PlotToSerial

#        unit:
#          - UnitToF
#          - UnitToF4M

        board:
          # Reduced from 24 to 9 boards: one per chip, plus the S3 boards with their own PSRAM / flash / USB build properties.
          # The other boards differ only in the variant header, so the library code compiles the same.
#          - arduino_nesso_n1  # ESP32-C6: represented by m5stack_nano_c6
#          - m5stack_atom  # ESP32: represented by m5stack_core
#          - m5stack_atoms3  # ESP32-S3: represented by m5stack_cores3
          - m5stack_atoms3r
#          - m5stack_capsule  # ESP32-S3: represented by m5stack_cores3
          - m5stack_cardputer
#          - m5stack_chain_dualkey
          - m5stack_core
#          - m5stack_core2  # ESP32: represented by m5stack_core
#          - m5stack_coreink  # ESP32: represented by m5stack_core
          - m5stack_cores3
#          - m5stack_dial  # ESP32-S3: represented by m5stack_cores3
#          - m5stack_dinmeter  # ESP32-S3: represented by m5stack_cores3
#          - m5stack_fire  # ESP32: represented by m5stack_core
          - m5stack_nano_c6
          - m5stack_nano_h2
#          - m5stack_paper  # ESP32: represented by m5stack_core
          - m5stack_papers3
#          - m5stack_poe_cam
#          - m5stack_powerhub
#          - m5stack_stamp_c3
#          - m5stack_stamp_pico
#          - m5stack_stamp_s3  # ESP32-S3: represented by m5stack_cores3
#          - m5stack_stamplc
#          - m5stack_station
#          - m5stack_stickc  # ESP32: represented by m5stack_core
#          - m5stack_stickc_plus  # ESP32: represented by m5stack_core
#          - m5stack_stickc_plus2  # ESP32: represented by m5stack_core
          - m5stack_sticks3
          - m5stack_tab5
#          - m5stack_timer_cam
#          - m5stack_tough
#          - m5stack_unit_c6l
#          - m5stack_unit_cam
#          - m5stack_unit_cams3

        platform-version:
          - 3.3.9

        platform:
          - m5stack

        archi:
          - esp32

        build-properties:
          - "-DUSING_UNIT_TOF"
          - "-DUSING_UNIT_TOF4M"
          - "-DUSING_UNIT_TOF90"
#          - "-DUSING_HAT_TOF"

        include:
          # Specific sketches
          # HAT
          - sketch: PlotToSerial
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            platform: m5stack
            archi: esp32
            platform-version: 3.3.9
            board: m5stack_stickc_plus
            build-properties: "-DUSING_HAT_TOF"
          - sketch: PlotToSerial
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            platform: m5stack
            archi: esp32
            platform-version: 3.3.9
            board: m5stack_stickc_plus2
            build-properties: "-DUSING_HAT_TOF"
          - sketch: PlotToSerial
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            platform: m5stack
            archi: esp32
            platform-version: 3.3.9
            board: m5stack_sticks3
            build-properties: "-DUSING_HAT_TOF"
          - sketch: PlotToSerial
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            platform: m5stack
            archi: esp32
            platform-version: 3.3.9
            board: m5stack_coreink
            build-properties: "-DUSING_HAT_TOF"
          - sketch: PlotToSerial
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            platform: m5stack
            archi: esp32
            platform-version: 3.3.9
            board: arduino_nesso_n1
            build-properties: "-DUSING_HAT_TOF"
          # DualSensor
          - sketch: DualSensor
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            platform: m5stack
            archi: esp32
            platform-version: 3.3.9
            board: m5stack_stickc_plus2
          # ViaPaHub
          - sketch: ViaPaHub
            platform-url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
            platform: m5stack
            archi: esp32
            platform-version: 3.3.9
            board: m5stack_core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare libraries list
        id: libs
        run: |
          {
            echo "yaml<<EOF"
            echo "$REQUIRED_LIBRARIES" | tr ',' '\n' | while read -r lib; do
              echo "- name: $lib"
            done
            echo "- source-path: ./"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.platform }}:${{ matrix.archi }}:${{ matrix.board }}
          platforms: |
            - name: ${{ matrix.platform }}:${{ matrix.archi }}
              source-url: ${{ matrix.platform-url }}
              version: ${{ matrix.platform-version }}
          libraries: ${{ steps.libs.outputs.yaml }}
          sketch-paths: |
            - ${{ env.SKETCH_NAMES_FIND_START }}/${{ matrix.sketch }}
          cli-compile-flags: |
            - --build-property
            - build.extra_flags=${{ matrix.build-properties }}
